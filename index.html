<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A4 RC Auto-Fill & Mapper (PDF/Image)</title>
    <!-- PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-base: #121212;
            --bg-panel: #1e1e1e;
            --bg-hover: #2d2d2d;
            --bg-input: #0a0a0a;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #333333;
            --danger: #ef4444;
            --success: #10b981;
            --debug-line: rgba(59, 130, 246, 0.8);
            --debug-bg: rgba(59, 130, 246, 0.1);
            --calibrate: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-wrap: wrap; gap: 10px; flex-shrink: 0; }
        .logo { font-weight: 600; font-size: 1.1rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        
        /* Buttons & Inputs */
        button { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px; }
        button:hover { background: var(--border); }
        button.primary { background: var(--accent); color: white; border-color: var(--accent); }
        button.primary:hover { background: var(--accent-hover); }
        button.calibrate-active { background: var(--calibrate); color: #000; border-color: var(--calibrate); }
        
        input[type="text"], input[type="number"], select, textarea { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 4px; outline: none; width: 100%; font-size: 0.85rem; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 4px; }
        
        /* Layout */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebars */
        .sidebar { background: var(--bg-panel); width: 380px; display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0; z-index: 5; }
        .sidebar.right { border-right: none; border-left: 1px solid var(--border); width: 320px; }
        
        .panel-header { padding: 10px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; background: #181818; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); flex-shrink: 0; }
        
        .scroll-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        
        /* Canvas Area */
        .canvas-container { 
            flex: 1; 
            background: #000; 
            position: relative; 
            min-width: 0; 
            min-height: 0;
            overflow: auto; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 24px; 
        }
        
        .canvas-wrapper { 
            margin: auto; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
            background: #fff;
        }
        
        canvas { display: block; cursor: crosshair; }
        
        .dropzone { position: absolute; inset: 20px; border: 2px dashed var(--border); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; opacity: 0; transition: 0.2s; z-index: 5; background: rgba(0,0,0,0.85); }
        .dropzone.active { opacity: 1; pointer-events: all; border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        
        /* Field List & Inspector */
        .field-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-base); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: 0.1s; }
        .field-item:hover { border-color: var(--accent); }
        .field-item.active { background: var(--debug-bg); border-color: var(--accent); }
        
        .inspector { background: #181818; border-top: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; max-height: 50%; overflow-y: auto; }
        .prop-row { display: flex; gap: 8px; align-items: flex-end; }
        .prop-row > div { flex: 1; }

        /* Status Log */
        .status-bar { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); padding: 5px 10px; font-size: 0.75rem; font-family: monospace; color: var(--success); z-index: 10; pointer-events: none; border-top: 1px solid var(--border);}
        
        .helper-text { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; line-height: 1.2; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            RC Auto-Fill
        </div>
        <div class="controls">
            <div style="display:flex; gap:6px; align-items:center;">
                <button onclick="document.getElementById('fileInput').click()">Upload RC (PDF/IMG)</button>
                <input type="file" id="fileInput" accept="application/pdf, image/*" style="display: none;" onchange="handleFileUpload(event)">
            </div>
            <div id="pdfControls" style="display:none; align-items:center; gap: 5px; border-left: 1px solid var(--border); padding-left: 15px;">
                <select id="pageSelect" onchange="changePDFPage(this.value)" style="width: 100px;"></select>
            </div>
            <div style="display:flex; align-items:center; gap: 5px; border-left: 1px solid var(--border); padding-left: 15px;">
                <select id="orientationSelect" onchange="changeOrientation()" style="width: 110px;">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                </select>
            </div>
            <div style="display:flex; gap:4px; border-left: 1px solid var(--border); padding-left: 15px;">
                <button onclick="zoom(-0.1)">-</button>
                <button onclick="fitToScreen()">Fit</button>
                <button onclick="zoom(0.1)">+</button>
            </div>
            <div style="display:flex; align-items:center; gap: 6px; border-left: 1px solid var(--border); padding-left: 15px;">
                <input type="checkbox" id="debugToggle" checked onchange="toggleDebug()">
                <label for="debugToggle" style="text-transform: none; cursor: pointer; margin-bottom: 0;">Markers</label>
            </div>
            <button class="primary" onclick="exportPNG()" style="margin-left: 10px;">Download PNG</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Left Sidebar: JSON Inputs -->
        <div class="sidebar">
            <div class="panel-header">Inputs</div>
            <div class="scroll-area">
                <div>
                    <label>Vehicle Data JSON (Auto-fills)</label>
                    <textarea id="dataJsonArea" style="height: 180px;" placeholder='{ "regn_no": "GJ05CX1400", "owner_name": "SACHIN", "address": "..." }'></textarea>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="parseDataAndRender()" class="primary" style="flex:1;">Render Now</button>
                    <button onclick="formatDataJSON()">Format JSON</button>
                </div>
                
                <hr style="border-color: var(--border); margin: 10px 0;">
                
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <label style="margin-bottom:0;">A4 Coordinate Map</label>
                        <button onclick="resetCoords()" style="padding: 2px 6px; font-size: 0.7rem;">Reset Default</button>
                    </div>
                    <textarea id="coordJsonArea" style="height: 200px; font-family: monospace; font-size: 0.75rem;"></textarea>
                    <p class="helper-text">Edit values manually or use the Calibrate tool on the right.</p>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="parseCoordsAndRender()" class="primary" style="flex:1;">Apply Coords</button>
                    <button onclick="formatCoordJSON()">Format</button>
                </div>
            </div>
        </div>

        <!-- Center: Canvas Viewport -->
        <div class="canvas-container" id="canvasContainer">
            <div class="dropzone" id="dropzone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="margin-bottom: 10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <h2>Drag & Drop Blank RC (PDF/IMG)</h2>
            </div>
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="status-bar" id="statusLog">Ready. Upload template & paste data.</div>
        </div>

        <!-- Right Sidebar: Fields & Fine-Tuning -->
        <div class="sidebar right">
            <div class="panel-header">
                Mapped Fields
                <button id="calibrateBtn" onclick="toggleCalibrate()" style="padding: 2px 8px; font-size: 0.7rem;">Calibrate Mode</button>
            </div>
            <div class="scroll-area" id="fieldList" style="max-height: 40%;">
                <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 20px;">Paste data JSON to load fields.</div>
            </div>
            
            <div class="panel-header" style="border-top: 1px solid var(--border);">Inspector</div>
            <div class="inspector">
                <div id="inspectorEmpty" style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 10px;">Select a field to edit.</div>
                
                <div id="inspectorControls" style="display: none; flex-direction: column; gap: 10px;">
                    <div style="font-weight: bold; color: var(--accent); font-size: 0.9rem;" id="insKey">field_key</div>
                    <div class="prop-row">
                        <div><label>X</label><input type="number" step="0.5" id="insX" oninput="updateFieldFromInspector('x', this.value)"></div>
                        <div><label>Y</label><input type="number" step="0.5" id="insY" oninput="updateFieldFromInspector('y', this.value)"></div>
                    </div>
                    <div class="prop-row">
                        <div><label>Max Width</label><input type="number" id="insMaxWidth" oninput="updateFieldFromInspector('maxWidth', this.value)"></div>
                        <div><label>Font Size</label><input type="number" step="0.5" id="insFontSize" oninput="updateFieldFromInspector('fontSize', this.value)"></div>
                    </div>
                    <div class="prop-row">
                        <div><label>Line Height</label><input type="number" step="0.5" id="insLineHeight" oninput="updateFieldFromInspector('lineHeight', this.value)"></div>
                        <div><label>Weight</label>
                            <select id="insFontWeight" onchange="updateFieldFromInspector('fontWeight', this.value)">
                                <option value="normal">Normal</option>
                                <option value="bold">Bold</option>
                            </select>
                        </div>
                    </div>
                    <div class="prop-row">
                        <div><label>Align</label>
                            <select id="insAlign" onchange="updateFieldFromInspector('align', this.value)">
                                <option value="left">Left</option>
                                <option value="center">Center</option>
                                <option value="right">Right</option>
                            </select>
                        </div>
                        <div><label>Color</label><input type="color" id="insColor" style="height: 32px; padding: 0;" onchange="updateFieldFromInspector('color', this.value)"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configure PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // --- Default Coordinates (A4 612x792 pt) ---
        const DEFAULT_A4_COORDS = {
            "refWidth": 612,
            "refHeight": 792,
            "fields": {
                "regn_no":           { "x": 480, "y": 90,  "fontSize": 16, "fontWeight": "bold",   "maxWidth": 100, "align": "center", "color": "#000" },
                "owner_name":        { "x": 60,  "y": 180, "fontSize": 12, "fontWeight": "normal", "maxWidth": 250, "align": "left",   "color": "#000" },
                "son_daughter_wife_of":{ "x": 60, "y": 200, "fontSize": 10, "fontWeight": "normal", "maxWidth": 250, "align": "left",   "color": "#000" },
                "address":           { "x": 60,  "y": 220, "fontSize": 10, "fontWeight": "normal", "maxWidth": 250, "align": "left",   "color": "#000", "lineHeight": 12 },
                "chassis_no":        { "x": 380, "y": 180, "fontSize": 12, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "engine_no":         { "x": 380, "y": 200, "fontSize": 12, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "fuel":              { "x": 380, "y": 220, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "maker":             { "x": 380, "y": 240, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "model":             { "x": 380, "y": 260, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "date_of_regn":      { "x": 60,  "y": 320, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "vehicle_class":     { "x": 60,  "y": 340, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "regn_validity":     { "x": 60,  "y": 360, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "color":             { "x": 380, "y": 320, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" },
                "body_type":         { "x": 380, "y": 340, "fontSize": 11, "fontWeight": "normal", "maxWidth": 150, "align": "left",   "color": "#000" }
            }
        };

        // --- State Management ---
        const state = {
            bgCanvas: document.createElement('canvas'), 
            pdfDoc: null,    
            currentPage: 1,
            fields: [], // Merged data + coords
            activeFieldId: null,
            showDebug: true,
            calibrateMode: false,
            zoom: 1,
            refWidth: DEFAULT_A4_COORDS.refWidth,
            refHeight: DEFAULT_A4_COORDS.refHeight,
            renderScale: 2.5,
            currentCoords: JSON.parse(JSON.stringify(DEFAULT_A4_COORDS)) // Deep copy
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const bgCtx = state.bgCanvas.getContext('2d');
        
        const wrapper = document.getElementById('canvasWrapper');
        const dropzone = document.getElementById('dropzone');
        const container = document.getElementById('canvasContainer');
        const fieldListEl = document.getElementById('fieldList');
        const inspectorEmpty = document.getElementById('inspectorEmpty');
        const inspectorControls = document.getElementById('inspectorControls');
        const dataJsonArea = document.getElementById('dataJsonArea');
        const coordJsonArea = document.getElementById('coordJsonArea');
        const pdfControls = document.getElementById('pdfControls');
        const pageSelect = document.getElementById('pageSelect');
        const statusLog = document.getElementById('statusLog');
        const calibrateBtn = document.getElementById('calibrateBtn');

        // --- Status Logger ---
        function logMsg(msg, isError = false) {
            statusLog.innerText = msg;
            statusLog.style.color = isError ? 'var(--danger)' : 'var(--success)';
        }

        // --- Initialization ---
        function init() {
            // Populate default coords box
            coordJsonArea.value = JSON.stringify(DEFAULT_A4_COORDS, null, 2);
            
            setupEvents();
            
            // Initialize blank A4 canvas
            canvas.width = Math.round(state.refWidth * state.renderScale);
            canvas.height = Math.round(state.refHeight * state.renderScale);
            state.bgCanvas.width = canvas.width;
            state.bgCanvas.height = canvas.height;
            
            bgCtx.fillStyle = '#ffffff';
            bgCtx.fillRect(0, 0, state.bgCanvas.width, state.bgCanvas.height);

            fitToScreen();
            renderAll();
        }

        // --- Core Rendering ---
        function renderAll() {
            // 1. White Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Offscreen Buffer (PDF/Image)
            if (state.bgCanvas.width > 0) {
                ctx.drawImage(state.bgCanvas, 0, 0);
            }

            const scaleX = canvas.width / state.refWidth;
            const scaleY = canvas.height / state.refHeight;
            const scaleFont = (scaleX + scaleY) / 2;

            // 3. Draw Fields (Only if they have a value)
            state.fields.forEach(f => {
                if (!f.value || f.value.trim() === "") return; // No empty boxes

                const drawX = f.x * scaleX;
                const drawY = f.y * scaleY;
                const maxW = (f.maxWidth || state.refWidth) * scaleX;
                const fSize = f.fontSize * scaleFont;
                const lh = (f.lineHeight || (f.fontSize * 1.4)) * scaleFont;

                ctx.fillStyle = f.color || '#000000';
                ctx.font = `${f.fontWeight || 'normal'} ${fSize}px Arial, sans-serif`;
                ctx.textAlign = f.align || 'left';
                ctx.textBaseline = 'top';

                drawWrappedText(ctx, f.value, drawX, drawY, maxW, lh);
            });

            // 4. Draw Debug Markers (If enabled, draw for ALL loaded fields)
            if (state.showDebug) {
                state.fields.forEach(f => {
                    const drawX = f.x * scaleX;
                    const drawY = f.y * scaleY;
                    const maxW = (f.maxWidth || state.refWidth) * scaleX;
                    const fSize = f.fontSize * scaleFont;
                    const lh = (f.lineHeight || (f.fontSize * 1.4)) * scaleFont;

                    ctx.font = `${f.fontWeight || 'normal'} ${fSize}px Arial, sans-serif`;
                    const displayValue = f.value || "[Empty]";
                    const lines = getLines(ctx, displayValue, maxW);
                    const totalHeight = lines.length * lh;

                    ctx.strokeStyle = state.activeFieldId === f.id ? 'var(--calibrate)' : 'var(--debug-line)';
                    ctx.lineWidth = Math.max(1, canvas.width / 800); 
                    ctx.setLineDash([5, 5]);

                    let bx = drawX;
                    if (f.align === 'center') bx = drawX - (maxW/2);
                    if (f.align === 'right') bx = drawX - maxW;

                    ctx.strokeRect(bx, drawY, maxW, totalHeight);
                    ctx.setLineDash([]);

                    // Crosshair
                    ctx.beginPath();
                    ctx.moveTo(drawX - 10, drawY); ctx.lineTo(drawX + 10, drawY);
                    ctx.moveTo(drawX, drawY - 10); ctx.lineTo(drawX, drawY + 10);
                    ctx.stroke();

                    // Label
                    ctx.fillStyle = state.activeFieldId === f.id ? 'var(--calibrate)' : 'var(--debug-line)';
                    ctx.font = `${Math.max(10, canvas.width/80)}px monospace`;
                    ctx.fillText(f.key, bx, drawY - 20);
                });
            }
        }

        // --- Logic: Parse Data & Coordinates ---
        function parseDataAndRender() {
            let dataObj = {};
            try {
                const str = dataJsonArea.value.trim();
                if (str) dataObj = JSON.parse(str);
            } catch (e) {
                logMsg("Invalid Data JSON: " + e.message, true);
                return;
            }

            // Merge with current coords
            const coordMap = state.currentCoords.fields || {};
            state.fields = [];

            // Create field objects based on coord map, attaching data if it exists
            for (const [key, coord] of Object.entries(coordMap)) {
                state.fields.push({
                    id: key,
                    key: key,
                    value: dataObj[key] !== undefined ? String(dataObj[key]) : "",
                    ...coord
                });
            }

            renderFieldList();
            renderAll();
            logMsg("Auto-filled fields from Data JSON.");
        }

        function parseCoordsAndRender() {
            try {
                const str = coordJsonArea.value.trim();
                const parsed = JSON.parse(str);
                
                if (!parsed.fields) throw new Error("Missing 'fields' object in JSON.");
                
                state.currentCoords = parsed;
                state.refWidth = parsed.refWidth || state.refWidth;
                state.refHeight = parsed.refHeight || state.refHeight;

                parseDataAndRender();
                logMsg("Coordinates updated & rendered.");
            } catch (e) {
                logMsg("Invalid Coord JSON: " + e.message, true);
            }
        }

        function resetCoords() {
            state.currentCoords = JSON.parse(JSON.stringify(DEFAULT_A4_COORDS));
            state.refWidth = DEFAULT_A4_COORDS.refWidth;
            state.refHeight = DEFAULT_A4_COORDS.refHeight;
            coordJsonArea.value = JSON.stringify(DEFAULT_A4_COORDS, null, 2);
            parseDataAndRender();
            logMsg("Coordinates reset to default.");
        }

        function updateCoordJsonBox() {
            // Sync state back to textarea when modified via UI
            state.currentCoords.fields = {};
            state.fields.forEach(f => {
                state.currentCoords.fields[f.key] = {
                    x: parseFloat(f.x.toFixed(2)),
                    y: parseFloat(f.y.toFixed(2)),
                    maxWidth: parseFloat(f.maxWidth.toFixed(2)),
                    fontSize: parseFloat(f.fontSize.toFixed(2)),
                    lineHeight: parseFloat((f.lineHeight || (f.fontSize * 1.4)).toFixed(2)),
                    fontWeight: f.fontWeight,
                    align: f.align,
                    color: f.color
                };
            });
            coordJsonArea.value = JSON.stringify(state.currentCoords, null, 2);
        }

        // --- File Handling (PDF & Image) ---
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            logMsg(`Loading file: ${file.name}...`);

            try {
                if (file.type === 'application/pdf') {
                    await handlePDF(file);
                } else if (file.type.startsWith('image/')) {
                    await handleImage(file);
                } else {
                    throw new Error("Unsupported file type.");
                }
            } catch (err) {
                logMsg(`Error: ${err.message}`, true);
                alert(`File Load Error: ${err.message}`);
            }
            e.target.value = ''; 
        }

        async function handlePDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            state.pdfDoc = await pdfjsLib.getDocument(arrayBuffer).promise;
            
            pageSelect.innerHTML = '';
            for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Page ${i}`;
                pageSelect.appendChild(opt);
            }
            pdfControls.style.display = 'flex';
            
            await renderPDFPage(1);
            dropzone.style.display = 'none';
            logMsg("PDF Loaded. Adjust coords if needed.");
        }

        async function renderPDFPage(pageNum) {
            if (!state.pdfDoc) return;
            logMsg(`Rendering PDF Page ${pageNum}...`);
            state.currentPage = pageNum;
            pageSelect.value = pageNum;

            const page = await state.pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: state.renderScale }); 
            
            state.bgCanvas.width = Math.round(viewport.width);
            state.bgCanvas.height = Math.round(viewport.height);

            // 🔥 Fix: Solid white background before PDF render
            bgCtx.fillStyle = '#ffffff';
            bgCtx.fillRect(0, 0, state.bgCanvas.width, state.bgCanvas.height);

            const renderContext = {
                canvasContext: bgCtx,
                viewport: viewport
            };

            await page.render(renderContext).promise;
            
            canvas.width = state.bgCanvas.width;
            canvas.height = state.bgCanvas.height;

            fitToScreen();
            parseDataAndRender();
        }

        async function handleImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        state.bgCanvas.width = img.width;
                        state.bgCanvas.height = img.height;
                        bgCtx.fillStyle = '#ffffff';
                        bgCtx.fillRect(0, 0, img.width, img.height);
                        bgCtx.drawImage(img, 0, 0);

                        canvas.width = img.width;
                        canvas.height = img.height;

                        state.pdfDoc = null; 
                        pdfControls.style.display = 'none';
                        dropzone.style.display = 'none';
                        
                        fitToScreen();
                        parseDataAndRender();
                        logMsg("Image loaded successfully.");
                        resolve();
                    };
                    img.onerror = () => reject(new Error("Failed to load image."));
                    img.src = event.target.result;
                };
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.readAsDataURL(file);
            });
        }

        function changePDFPage(pageNum) {
            renderPDFPage(parseInt(pageNum));
        }

        // --- Text Rendering & Wrapping ---
        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const lines = getLines(ctx, text, maxWidth);
            lines.forEach((line, index) => {
                ctx.fillText(line, x, y + (index * lineHeight));
            });
        }

        function getLines(ctx, text, maxWidth) {
            const paragraphs = String(text).split('\n');
            let allLines = [];

            paragraphs.forEach(para => {
                if (!para) { allLines.push(''); return; }
                const words = para.split(' ');
                let currentLine = words[0];

                for (let i = 1; i < words.length; i++) {
                    const word = words[i];
                    const width = ctx.measureText(currentLine + " " + word).width;
                    if (width < maxWidth) {
                        currentLine += " " + word;
                    } else {
                        allLines.push(currentLine);
                        currentLine = word;
                    }
                }
                allLines.push(currentLine);
            });
            return allLines;
        }

        // --- UI & Inspector ---
        function renderFieldList() {
            fieldListEl.innerHTML = '';
            if (state.fields.length === 0) {
                fieldListEl.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 20px;">Paste Data JSON to load fields.</div>';
                return;
            }

            state.fields.forEach(f => {
                const isFilled = f.value && f.value.trim() !== "";
                const div = document.createElement('div');
                div.className = `field-item ${state.activeFieldId === f.id ? 'active' : ''}`;
                div.innerHTML = `<span style="font-weight:600; font-size:0.85rem; ${!isFilled ? 'color:var(--text-muted)' : ''}">${f.key}</span> 
                                 <span style="color:var(--text-muted); font-size:0.75rem; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${isFilled ? f.value : '(empty)'}</span>`;
                div.onclick = () => selectField(f.id);
                fieldListEl.appendChild(div);
            });
        }

        function selectField(id) {
            state.activeFieldId = id;
            renderFieldList();
            renderAll();
            updateInspector();
        }

        function updateInspector() {
            const field = state.fields.find(f => f.id === state.activeFieldId);
            if (!field) {
                inspectorEmpty.style.display = 'block';
                inspectorControls.style.display = 'none';
                return;
            }
            inspectorEmpty.style.display = 'none';
            inspectorControls.style.display = 'flex';

            document.getElementById('insKey').innerText = field.key;
            document.getElementById('insX').value = field.x.toFixed(1);
            document.getElementById('insY').value = field.y.toFixed(1);
            document.getElementById('insMaxWidth').value = field.maxWidth.toFixed(1);
            document.getElementById('insFontSize').value = field.fontSize.toFixed(1);
            document.getElementById('insLineHeight').value = (field.lineHeight || (field.fontSize * 1.4)).toFixed(1);
            document.getElementById('insFontWeight').value = field.fontWeight || 'normal';
            document.getElementById('insAlign').value = field.align || 'left';
            document.getElementById('insColor').value = field.color || '#000000';
        }

        function updateFieldFromInspector(prop, val) {
            const field = state.fields.find(f => f.id === state.activeFieldId);
            if (!field) return;

            if (['x', 'y', 'maxWidth', 'fontSize', 'lineHeight'].includes(prop)) {
                field[prop] = parseFloat(val) || 0;
            } else {
                field[prop] = val;
            }
            renderAll();
            updateCoordJsonBox(); // Keep JSON in sync
        }

        // --- Canvas Interactions ---
        function setupEvents() {
            // Auto-parse Data JSON
            let timeout = null;
            dataJsonArea.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(parseDataAndRender, 800);
            });

            // Zoom via Ctrl+Scroll
            container.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    zoom(e.deltaY > 0 ? -0.1 : 0.1);
                }
            });

            // Click on Canvas (Select field or Calibrate)
            canvas.addEventListener('mousedown', (e) => {
                if (state.fields.length === 0) return;
                
                const rect = canvas.getBoundingClientRect();
                const baseX = ((e.clientX - rect.left) / rect.width) * canvas.width;
                const baseY = ((e.clientY - rect.top) / rect.height) * canvas.height;

                const scaleX = canvas.width / state.refWidth;
                const scaleY = canvas.height / state.refHeight;

                // 🔥 CALIBRATE MODE
                if (state.calibrateMode && state.activeFieldId) {
                    const field = state.fields.find(f => f.id === state.activeFieldId);
                    if (field) {
                        // Convert click to A4 coordinates
                        field.x = baseX / scaleX;
                        field.y = baseY / scaleY;
                        
                        updateInspector();
                        updateCoordJsonBox();
                        renderAll();
                        logMsg(`Calibrated ${field.key} to (${field.x.toFixed(1)}, ${field.y.toFixed(1)})`);
                    }
                    return; // Don't select another field while calibrating
                }

                // 🔥 SELECT FIELD MODE
                const scaleFont = (scaleX + scaleY) / 2;
                for (let i = state.fields.length - 1; i >= 0; i--) {
                    const f = state.fields[i];
                    const drawX = f.x * scaleX;
                    const drawY = f.y * scaleY;
                    const maxW = (f.maxWidth || state.refWidth) * scaleX;
                    const fSize = f.fontSize * scaleFont;
                    const lh = (f.lineHeight || (f.fontSize * 1.4)) * scaleFont;

                    ctx.font = `${f.fontWeight || 'normal'} ${fSize}px Arial, sans-serif`;
                    const displayVal = f.value || "[Empty]";
                    const lines = getLines(ctx, displayVal, maxW);
                    const totalHeight = lines.length * lh;
                    
                    let bx = drawX;
                    if (f.align === 'center') bx = drawX - (maxW/2);
                    if (f.align === 'right') bx = drawX - maxW;

                    if (baseX >= bx && baseX <= bx + maxW &&
                        baseY >= drawY && baseY <= drawY + totalHeight) {
                        selectField(f.id);
                        return;
                    }
                }
                
                // Deselect if empty space clicked
                state.activeFieldId = null;
                updateInspector();
                renderAll();
                renderFieldList();
            });

            // Keyboard Nudge
            window.addEventListener('keydown', (e) => {
                if (!state.activeFieldId || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                const f = state.fields.find(x => x.id === state.activeFieldId);
                if (!f) return;

                const step = e.shiftKey ? 1 : 0.5;
                let changed = false;

                if (e.key === 'ArrowLeft') { f.x -= step; changed = true; }
                if (e.key === 'ArrowRight') { f.x += step; changed = true; }
                if (e.key === 'ArrowUp') { f.y -= step; changed = true; }
                if (e.key === 'ArrowDown') { f.y += step; changed = true; }

                if (changed) {
                    e.preventDefault();
                    updateInspector();
                    updateCoordJsonBox();
                    renderAll();
                }
            });

            // Drag & Drop Zone
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('active');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFileUpload({ target: { files: e.dataTransfer.files } });
                }
            });
        }

        function toggleCalibrate() {
            state.calibrateMode = !state.calibrateMode;
            if (state.calibrateMode) {
                calibrateBtn.classList.add('calibrate-active');
                calibrateBtn.innerText = "Click Canvas to Set";
                logMsg("Calibrate Mode ON: Click a field in the list, then click on the canvas to place it.");
            } else {
                calibrateBtn.classList.remove('calibrate-active');
                calibrateBtn.innerText = "Calibrate Mode";
                logMsg("Calibrate Mode OFF.");
            }
        }

        // --- Helpers ---
        function zoom(delta) {
            state.zoom = Math.max(0.1, Math.min(state.zoom + delta, 5));
            applyZoom();
        }

        function fitToScreen() {
            if (!canvas.width || !canvas.height) return;
            requestAnimationFrame(() => {
                const containerW = container.clientWidth - 60;
                const containerH = container.clientHeight - 60;
                const scaleX = containerW / canvas.width;
                const scaleY = containerH / canvas.height;
                state.zoom = Math.min(scaleX, scaleY, 1);
                applyZoom();
            });
        }

        function applyZoom() {
            canvas.style.width = `${Math.round(canvas.width * state.zoom)}px`;
            canvas.style.height = `${Math.round(canvas.height * state.zoom)}px`;
        }

        function toggleDebug() {
            state.showDebug = document.getElementById('debugToggle').checked;
            renderAll();
        }

        function formatDataJSON() {
            try {
                if (dataJsonArea.value.trim()) {
                    dataJsonArea.value = JSON.stringify(JSON.parse(dataJsonArea.value), null, 2);
                }
            } catch (e) { alert("Invalid JSON format."); }
        }

        function formatCoordJSON() {
            try {
                if (coordJsonArea.value.trim()) {
                    coordJsonArea.value = JSON.stringify(JSON.parse(coordJsonArea.value), null, 2);
                }
            } catch (e) { alert("Invalid JSON format."); }
        }

        // --- Export Clean Image ---
        function exportPNG() {
            if (!canvas.width || !canvas.height) return alert("Please load a template first.");

            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');

            // 1. Draw Background
            offCtx.fillStyle = '#ffffff';
            offCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);
            if (state.bgCanvas.width > 0) {
                offCtx.drawImage(state.bgCanvas, 0, 0);
            }

            const scaleX = offCanvas.width / state.refWidth;
            const scaleY = offCanvas.height / state.refHeight;
            const scaleFont = (scaleX + scaleY) / 2;

            // 2. Draw Fields (No Debug Markers)
            state.fields.forEach(f => {
                if (!f.value || f.value.trim() === "") return;

                offCtx.fillStyle = f.color || '#000000';
                offCtx.font = `${f.fontWeight || 'normal'} ${f.fontSize * scaleFont}px Arial, sans-serif`;
                offCtx.textAlign = f.align || 'left';
                offCtx.textBaseline = 'top';

                const drawX = f.x * scaleX;
                const drawY = f.y * scaleY;
                const maxW = (f.maxWidth || state.refWidth) * scaleX;
                const lh = (f.lineHeight || (f.fontSize * 1.4)) * scaleFont;

                drawWrappedText(offCtx, f.value, drawX, drawY, maxW, lh);
            });

            // 3. Download
            const link = document.createElement('a');
            link.download = `filled_rc_${Date.now()}.png`;
            link.href = offCanvas.toDataURL('image/png');
            link.click();
            logMsg("Exported clean PNG successfully.");
        }

        // Start
        init();
    </script>
</body>
</html>
